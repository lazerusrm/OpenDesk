[package]
name = "opendesk"
version = "0.1.0"
edition = "2021"
description = "Self-hosted RustDesk OSS control plane"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.12"
base64 = "0.22"
bcrypt = "0.15.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
cookie = "0.18"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
terminal-input = { package = "rpassword", version = "7.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "time"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "migration_manifest_contract"
path = "tests/migration_manifest_contract.rs"
[lib]
name = "opendesk"
path = "src/lib.rs"

[[bin]]
name = "opendesk"
path = "src/main.rs"

[[bin]]
name = "opendesk-migration-dry-run"
path = "src/bin/opendesk-migration-dry-run.rs"

[[bin]]
name = "opendesk-migration-preflight"
path = "src/bin/opendesk-migration-preflight.rs"

[[bin]]
name = "opendesk-migration-apply"
path = "src/bin/opendesk-migration-apply.rs"

[[bin]]
name = "opendesk-migration-credentials-attach"
path = "src/bin/opendesk-migration-credentials-attach.rs"

[[bin]]
name = "opendesk-user-password-reset"
path = "src/bin/opendesk-user-password-reset.rs"
